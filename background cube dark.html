<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Master Cube</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23111214'/><rect x='3' y='3' width='10' height='10' fill='none' stroke='%23e5e5e5'/></svg>" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background:
      radial-gradient(60% 50% at 78% 10%, rgba(255,190,120,0.09), transparent 60%),
      linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.045) 50%, transparent 58%),
      radial-gradient(90% 70% at 50% 30%, #0c0c0e 0%, #050506 55%, #020203 100%);
  }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .overlay {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(115% 90% at 50% 42%, transparent 38%, rgba(0,0,0,0.7) 100%);
  }
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  }
</style>
</head>
<body>

<div id="app" class="fixed inset-0"></div>
<div class="overlay"></div>
<div class="grain"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }      from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer }     from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }         from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass }          from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass }    from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }         from 'three/addons/postprocessing/OutputPass.js';

/* ── constants ─────────────────────────────────────────── */
const SPACING = 1.06, HALF = Math.PI / 2, CUBIE = 1.0;
const GRID = [-1.5, -0.5, 0.5, 1.5];
const AXI  = { x: 0, y: 1, z: 2 };
const AXV  = { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(0,0,1) };
const DUR = 0.6, GAP_MIN = 0.16, GAP_MAX = 0.38;
const rnd = (a, b) => a + Math.random() * (b - a);

/* ── renderer ─────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;               // kept for cube self-shadowing only
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('app').appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 80);
const dist = innerWidth / innerHeight < 0.75 ? 14.5 : 11.6;
camera.position.set(dist * 0.72, dist * 0.5, dist * 0.86);

/* ── environment: softboxes + hot sun glint ────────────── */
{
  const env = new THREE.Scene();
  const box = (w, h, pos, s) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(s, s, s) })
    );
    m.position.set(...pos);
    m.lookAt(0, 0, 0);
    env.add(m);
  };
  box(10, 4,    [0, 8, 0],   3);
  box(1.2, 8,   [-8, 2, 2],  1.5);
  box(3, 6,     [8, 1, -2],  0.9);
  box(6, 1.5,   [0, 3, -9],  2);
  box(1.6, 1.6, [6, 8, 5],   28);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
}

/* ── sunlight with window-blinds gobo ──────────────────── */
const blindsTex = (() => {
  const s = 512, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  g.save(); g.translate(s / 2, s / 2); g.rotate(-0.35);
  for (let i = 0; i < 6; i++) {
    const x = -260 + i * 96;
    const grad = g.createLinearGradient(x, 0, x + 58, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.25, 'rgba(255,255,255,1)');
    grad.addColorStop(0.75, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(x, -400, 58, 800);
  }
  g.restore();
  for (let i = 0; i < 1500; i++) {
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`;
    g.fillRect(Math.random() * s, Math.random() * s, 1, 1);
  }
  return new THREE.CanvasTexture(c);
})();

const sun = new THREE.SpotLight(0xffd9a4, 1300, 0, 0.5, 0.45, 2);
sun.position.set(12, 16, 10);
sun.map = blindsTex;
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 5;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

scene.add(new THREE.HemisphereLight(0xa8c0d8, 0x0a0a0a, 0.35));
const rim = new THREE.DirectionalLight(0xcfd8e6, 0.7);
rim.position.set(-8, 5, -7);
scene.add(rim);
const under = new THREE.PointLight(0xffffff, 1.2, 26, 2);
under.position.set(0, -6.5, 4.5);
scene.add(under);

/* ── procedural micro-textures ─────────────────────────── */
function canvasTex(size, repeat, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = maxAniso;
  return t;
}

const texGrain = canvasTex(128, 4, (g, s) => {
  g.fillStyle = '#909090'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 5000; i++) {
    const v = 128 + rnd(-45, 45) | 0;
    g.fillStyle = `rgba(${v},${v},${v},0.5)`;
    g.fillRect(Math.random() * s, Math.random() * s, 1, 1);
  }
});
const texSpeckle = canvasTex(256, 2, (g, s) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 320; i++) {
    const v = rnd(90, 255) | 0;
    g.fillStyle = `rgba(${v},${v},${v},${rnd(0.4, 1)})`;
    g.beginPath(); g.arc(Math.random() * s, Math.random() * s, rnd(0.4, 1.3), 0, 7); g.fill();
  }
});
const texHex = canvasTex(256, 2, (g, s) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  g.strokeStyle = '#5a5a5a'; g.lineWidth = 2;
  const r = 14, h = r * Math.sin(Math.PI / 3);
  for (let y = -1; y < s / (h * 2) + 1; y++)
    for (let x = -1; x < s / (r * 3) + 1; x++) {
      const cx = x * 3 * r + (y % 2 ? 1.5 * r : 0), cy = y * h * 2;
      g.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i + Math.PI / 6;
        const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.stroke();
    }
});
const texDots = canvasTex(128, 3, (g, s) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#4a4a4a';
  for (let y = 4; y < s; y += 8)
    for (let x = 4; x < s; x += 8) { g.beginPath(); g.arc(x, y, 1.4, 0, 7); g.fill(); }
});
const texBrush = canvasTex(256, 2, (g, s) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 700; i++) {
    const v = rnd(30, 120) | 0;
    g.strokeStyle = `rgba(${v},${v},${v},${rnd(0.2, 0.7)})`;
    g.lineWidth = rnd(0.5, 1.2);
    const y = Math.random() * s;
    g.beginPath(); g.moveTo(0, y); g.lineTo(s, y + rnd(-2, 2)); g.stroke();
  }
});

/* ── materials ─────────────────────────────────────────── */
const plastic = new THREE.MeshPhysicalMaterial({
  color: 0x0b0c0d, roughness: 0.9, roughnessMap: texGrain,
  bumpMap: texGrain, bumpScale: 0.015,
  clearcoat: 0.9, clearcoatRoughness: 0.18,
  metalness: 0.1, envMapIntensity: 1.1,
});

const FINISHES = [
  () => new THREE.MeshPhysicalMaterial({ color: 0x0a0a0b, roughness: 0.9, roughnessMap: texSpeckle,
    bumpMap: texSpeckle, bumpScale: 0.02, clearcoat: 1, clearcoatRoughness: 0.07, envMapIntensity: 1.4 }),
  () => new THREE.MeshPhysicalMaterial({ color: 0x15161a, roughness: 0.55,
    bumpMap: texSpeckle, bumpScale: 0.03, envMapIntensity: 0.9 }),
  () => new THREE.MeshPhysicalMaterial({ color: 0x0c0d10, roughness: 0.4,
    bumpMap: texHex, bumpScale: 0.025, clearcoat: 0.45, clearcoatRoughness: 0.25, envMapIntensity: 1.2 }),
  () => new THREE.MeshPhysicalMaterial({ color: 0x101114, roughness: 0.5,
    bumpMap: texDots, bumpScale: 0.03, envMapIntensity: 1.0 }),
  () => new THREE.MeshPhysicalMaterial({ color: 0x17181b, roughness: 0.35, metalness: 0.45,
    bumpMap: texBrush, bumpScale: 0.02, envMapIntensity: 1.3 }),
  () => new THREE.MeshPhysicalMaterial({ color: 0x2a2d31, roughness: 0.3,
    clearcoat: 0.6, clearcoatRoughness: 0.2, envMapIntensity: 1.2 }),
];
const pickFinish = () => {
  const r = Math.random();
  const i = r < 0.26 ? 0 : r < 0.46 ? 1 : r < 0.62 ? 2 : r < 0.76 ? 3 : r < 0.9 ? 4 : 5;
  return FINISHES[i]();
};

/* ── dust motes in the sunbeam ─────────────────────────── */
const dustN = 160;
const dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) {
  dustPos[i * 3]     = rnd(-6, 6);
  dustPos[i * 3 + 1] = rnd(-3, 5);
  dustPos[i * 3 + 2] = rnd(-6, 6);
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xd8dce2, size: 0.02, transparent: true, opacity: 0.45, depthWrite: false,
}));
scene.add(dust);

/* ── the 4×4 cube ──────────────────────────────────────── */
const cubeRoot = new THREE.Group();
scene.add(cubeRoot);
const pivot = new THREE.Group();
cubeRoot.add(pivot);

function roundedRect(w, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -w / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);    s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + w - r);s.quadraticCurveTo(x + w, y + w, x + w - r, y + w);
  s.lineTo(x + r, y + w);    s.quadraticCurveTo(x, y + w, x, y + w - r);
  s.lineTo(x, y + r);        s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
const stickerGeo = new THREE.ShapeGeometry(roundedRect(0.82, 0.15), 8);
const cubieGeo   = new RoundedBoxGeometry(CUBIE, CUBIE, CUBIE, 6, 0.12);

const FACE_DEFS = [
  { n: [-1, 0, 0], rot: [ 0, -HALF, 0] },
  { n: [ 1, 0, 0], rot: [ 0,  HALF, 0] },
  { n: [ 0,-1, 0], rot: [ HALF, 0, 0] },
  { n: [ 0, 1, 0], rot: [-HALF, 0, 0] },
  { n: [ 0, 0,-1], rot: [ 0, Math.PI, 0] },
  { n: [ 0, 0, 1], rot: [ 0, 0, 0] },
];

const cubies = [];
for (let ix = 0; ix < 4; ix++)
for (let iy = 0; iy < 4; iy++)
for (let iz = 0; iz < 4; iz++) {
  const mesh = new THREE.Mesh(cubieGeo, plastic);
  mesh.castShadow = mesh.receiveShadow = true;

  const faces = [];
  if (ix === 0) faces.push(0); if (ix === 3) faces.push(1);
  if (iy === 0) faces.push(2); if (iy === 3) faces.push(3);
  if (iz === 0) faces.push(4); if (iz === 3) faces.push(5);
  for (const f of faces) {
    const def = FACE_DEFS[f];
    const st = new THREE.Mesh(stickerGeo, pickFinish());
    st.position.set(def.n[0] * 0.506, def.n[1] * 0.506, def.n[2] * 0.506);
    st.rotation.set(...def.rot);
    mesh.add(st);
  }

  const pos = new THREE.Vector3(ix - 1.5, iy - 1.5, iz - 1.5);
  mesh.position.copy(pos).multiplyScalar(SPACING);
  cubeRoot.add(mesh);
  cubies.push({ mesh, pos, orient: new THREE.Matrix3() });
}

/* ── orbit ───────────────────────────────────────────── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 7.5;
controls.maxDistance = 22;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
let idleTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end',   () => { idleTimer = setTimeout(() => controls.autoRotate = true, 2600); });

/* ── post: DOF + subtle bloom ──────────────────────────── */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: dist, aperture: 0.00018, maxblur: 0.005 });
composer.addPass(bokeh);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.26, 0.6, 0.8));
composer.addPass(new OutputPass());

/* ── scramble engine ───────────────────────────────────── */
let current = null, pending = 1.0, lastKey = '';
const rand = (a, b) => a + Math.random() * (b - a);
const easeInOutQuart = t => t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;

function rotVec(v, axis, dir) {
  const { x, y, z } = v;
  if (axis === 'x') dir > 0 ? v.set(x, -z,  y) : v.set(x,  z, -y);
  if (axis === 'y') dir > 0 ? v.set(z,  y, -x) : v.set(-z, y,  x);
  if (axis === 'z') dir > 0 ? v.set(-y, x,  z) : v.set(y, -x,  z);
}
const _m4 = new THREE.Matrix4();
function snapMesh(c) {
  c.mesh.position.copy(c.pos).multiplyScalar(SPACING);
  _m4.setFromMatrix3(c.orient);
  c.mesh.quaternion.setFromRotationMatrix(_m4);
}
function startMove() {
  let axis, layer;
  do {
    axis  = ['x', 'y', 'z'][(Math.random() * 3) | 0];
    layer = (Math.random() * 4) | 0;
  } while (axis + layer === lastKey);
  lastKey = axis + layer;
  const turns = Math.random() < 0.12 ? 2 : 1;
  const dir   = Math.random() < 0.5 ? 1 : -1;
  const group = cubies.filter(c => Math.abs(c.pos.getComponent(AXI[axis]) - GRID[layer]) < 0.01);
  pivot.rotation.set(0, 0, 0);
  for (const c of group) pivot.attach(c.mesh);
  current = { axis, dir, turns, group, t: 0, angle: dir * turns * HALF, dur: DUR * (turns === 2 ? 1.35 : 1) };
}
function finalizeMove() {
  const { axis, dir, turns, group } = current;
  _m4.makeRotationAxis(AXV[axis], dir * turns * HALF);
  const m3 = new THREE.Matrix3().setFromMatrix4(_m4);
  m3.elements.forEach((v, i) => m3.elements[i] = Math.round(v));
  for (const c of group) {
    cubeRoot.attach(c.mesh);
    for (let k = 0; k < turns; k++) rotVec(c.pos, axis, dir);
    c.orient.premultiply(m3);
    snapMesh(c);
  }
  pivot.rotation.set(0, 0, 0);
  current = null;
  pending = rand(GAP_MIN, GAP_MAX);
}

/* ── random-direction tumble spin ──────────────────────── */
function randomSpin() {
  const v = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1));
  if (v.lengthSq() < 0.01) v.set(0, 1, 0);
  return v.normalize().multiplyScalar(rnd(0.5, 0.9));   // faster than before
}
const spinVel = randomSpin();
let spinTarget = randomSpin();
let spinTimer = rnd(2, 4);
const _axis = new THREE.Vector3();
const _q = new THREE.Quaternion();

/* ── loop ──────────────────────────────────────────────── */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (current) {
    current.t += dt / current.dur;
    pivot.rotation[current.axis] = current.angle * easeInOutQuart(Math.min(current.t, 1));
    if (current.t >= 1) finalizeMove();
  } else {
    pending -= dt;
    if (pending <= 0) startMove();
  }

  /* pick a new random spin direction every few seconds, ease into it */
  spinTimer -= dt;
  if (spinTimer <= 0) {
    spinTarget = randomSpin();
    spinTimer = rnd(2, 4);
  }
  spinVel.lerp(spinTarget, 1 - Math.exp(-dt * 1.4));
  const angle = spinVel.length() * dt;
  if (angle > 1e-6) {
    _axis.copy(spinVel).normalize();
    _q.setFromAxisAngle(_axis, angle);
    cubeRoot.quaternion.premultiply(_q);   // world-space tumble
  }

  /* sun drifts slowly → shadows & light slats crawl */
  sun.position.x = 12 + Math.sin(t * 0.04) * 1.6;
  sun.position.z = 10 + Math.cos(t * 0.03) * 1.6;

  dust.rotation.y = t * 0.02;
  dust.position.y = Math.sin(t * 0.1) * 0.3;

  bokeh.uniforms['focus'].value = camera.position.distanceTo(controls.target);
  controls.update();
  composer.render();
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
